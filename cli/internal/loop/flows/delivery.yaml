# The delivery of one approved change (decision 0002, D21). gofi carries it;
# a project overrides it with .claude/flows/delivery.yaml.
schema: gofi-flow/v1
name: delivery
start: plan

nodes:
  # The plan decomposes a backend change into tasks by layer; a change of a
  # screen or a pipeline has none, and passes.
  plan:      {kind: agent, stage: plan, optional: true}
  # Who implements and who audits is dispatched by the change's facts —
  # change.surface, layer, sensor.green — from the roles' contracts (0002,
  # D18): one role per layer with work, in the plan's order.
  implement: {kind: agent, stage: implement}
  # The tests are written by a role of their own, from the scenarios — not
  # by whoever wrote the code they judge (D17).
  test:      {kind: agent, stage: test, optional: true}
  # Cheapest first; graph reindexes the code the turn changed, so the audit
  # reads a map that holds it and no agent rebuilds the index by hand.
  sense:     {kind: sensor, stages: [build, static, test, graph]}
  # What the build, the static analysis or the graph refused is repaired
  # with the findings alone, before anything reaches the audit.
  repair:    {kind: agent, stage: repair}
  # The run cannot go on — the contract is wrong, or nothing progresses on
  # the highest tier: triage proposes what to change, the person decides
  # (0002, D9).
  triage:    {kind: agent, stage: triage}
  # The audit runs in lenses, at once — each reads, none writes — and gofi
  # merges their verdicts by fingerprint (D17).
  audit:     {kind: agent, stage: audit, parallel: true}
  policy:    {kind: policy}
  plan-decide: {kind: gate}
  decide:      {kind: gate}
  test-decide: {kind: gate}
  accepted:  {kind: terminal, outcome: accepted}
  impasse:   {kind: terminal, outcome: impasse}
  exhausted: {kind: terminal, outcome: exhausted}

edges:
  # A turn stopped on a decision the change does not cover: the person
  # answers, and the stage that asked runs again.
  - {from: plan, to: plan-decide, when: {blocked: true}}
  - {from: plan, to: implement}
  - {from: implement, to: decide, when: {blocked: true}}
  - {from: implement, to: test}
  - {from: test, to: test-decide, when: {blocked: true}}
  - {from: test, to: sense}
  # Code that does not build or pass its tests never reaches the audit:
  # what the compiler, vet or the graph refused goes to repair, a failing
  # test back to the implementation.
  - {from: sense, to: triage, when: {stuck: true}}
  - {from: sense, to: repair, when: {sensor_failed: [build, static, graph]}}
  - {from: sense, to: implement, when: {sensor_failed: []}}
  - {from: sense, to: audit}
  - {from: repair, to: sense}
  - {from: audit, to: policy}
  - {from: policy, to: accepted, when: {accept: true}}
  # The contract is wrong, or the discovery behind it: not the loop's to fix.
  - {from: policy, to: triage, when: {owner: [spec, pd]}}
  - {from: policy, to: impasse, when: {oscillation: true}}
  - {from: policy, to: triage, when: {stuck: true}}
  # What the audit found only in the tests goes to who wrote them.
  - {from: policy, to: test, when: {tests_only: true}}
  # Not accepted yet: back with the findings, on the same tier until two
  # iterations do not progress (loop.escalate).
  - {from: policy, to: implement, when: {stuck: false}}
  - {from: policy, to: impasse}
  - {from: triage, to: impasse}
  - {from: plan-decide, to: plan, when: {answered: true}}
  - {from: plan-decide, to: impasse}
  - {from: decide, to: implement, when: {answered: true}}
  - {from: decide, to: impasse}
  - {from: test-decide, to: test, when: {answered: true}}
  - {from: test-decide, to: impasse}

# A spent limit ends the run: it never falls through to the next edge.
on_limit: exhausted
limits:
  - {from: sense, to: implement, max: 3}
  - {from: sense, to: repair, max: 3}
  - {from: policy, to: implement, max: 4}
  - {from: policy, to: test, max: 3}
  - {from: plan-decide, to: plan, max: 3}
  - {from: decide, to: implement, max: 3}
  - {from: test-decide, to: test, max: 3}
