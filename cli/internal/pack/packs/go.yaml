# The Go language pack (decision 0002, D13): the commands the loop's sensors
# run and the format each reports in. {src} is the backend folder of
# .gofi.yaml; a project overrides a stage with loop.sensors.
schema: gofi-pack/v1
language: go
tests: ["*_test.go"]
sources: ["*.go"]
skips: ["t.Skip(", "t.SkipNow(", "t.Skipf("]
sensors:
  # Cheapest first: a run stops at the first stage that fails.
  build:  {run: "go -C {src} build ./...", format: lines}
  static: {run: "go -C {src} vet ./...", format: lines}
  # go test -json says which tests failed and which were skipped: a skipped
  # test proves nothing, so it fails the stage.
  test:   {run: "go -C {src} test -json ./...", format: go-test-json}
# A context's code is under domain/<context>/, one folder per layer
# (sdk/go/knowledge/structure.md); a file of the context in no layer's folder
# is its domain. The plan's layer of each is gofi-plan's: the model — entity
# and DTOs — is data.
contexts: "domain/{context}/"
layers:
  - {name: handler,    plan: api,         paths: ["domain/*/handler/**"]}
  - {name: repository, plan: data,        paths: ["domain/*/repository/**"]}
  - {name: migration,  plan: data,        paths: [".migrations/**"]}
  - {name: adapter,    plan: integration, paths: ["domain/*/adapter/**"]}
  - {name: service,    plan: domain,      paths: ["domain/*/service/**"]}
  - {name: model,      plan: data,        paths: ["domain/*/model/**"]}
  - {name: domain,     plan: domain,      paths: ["domain/*/*"]}
graph:
  # sdk/go/knowledge/layers.md: a handler never reaches the repository, a
  # repository never knows a DTO's caller, the service never the HTTP.
  rules:
    - "deny: handler -> repository"
    - "deny: repository -> service"
    - "deny: repository -> handler"
    - "deny: service -> handler"
    - "deny: model -> service"
    - "deny: model -> repository"
    - "deny: model -> handler"
    - "deny: import \"net/http\" from service"
    - "deny: import \"net/http\" from repository"
    - "deny: import \"net/http\" from model"
    - "deny: new-cycle"
